<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <pattern id="dot-pattern" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#121212" opacity="0.08"/>
    </pattern>
    <filter id="shadow">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#121212"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="#FFEE00"/>
  <rect width="800" height="450" fill="url(#dot-pattern)"/>

  <!-- Border -->
  <rect x="16" y="16" width="768" height="418" fill="none" stroke="#121212" stroke-width="8" rx="12"/>

  <!-- Top Badge -->
  <rect x="40" y="40" width="180" height="36" fill="#E63946" stroke="#121212" stroke-width="4" rx="6" filter="url(#shadow)"/>
  <text x="130" y="63" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">TEMPLATE EXCEL</text>

  <!-- Main Comic Card Inside -->
  <rect x="40" y="95" width="720" height="260" fill="#FFFFFF" stroke="#121212" stroke-width="6" rx="12" filter="url(#shadow)"/>

  <!-- Title -->
  <text x="70" y="160" fill="#121212" font-family="sans-serif" font-weight="900" font-size="32" letter-spacing="0.5">LAPORAN KEUANGAN BULANAN</text>
  <text x="70" y="200" fill="#E63946" font-family="sans-serif" font-weight="900" font-size="28">UMKM &amp; BISNIS PERSONAL 2026</text>

  <!-- Features -->
  <rect x="70" y="230" width="180" height="32" fill="#1D3557" stroke="#121212" stroke-width="3" rx="4"/>
  <text x="160" y="251" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">OTOMATIS RUMUS REKAP</text>

  <rect x="260" y="230" width="180" height="32" fill="#1D3557" stroke="#121212" stroke-width="3" rx="4"/>
  <text x="350" y="251" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">GRAFIK CASHFLOW</text>

  <rect x="450" y="230" width="180" height="32" fill="#1D3557" stroke="#121212" stroke-width="3" rx="4"/>
  <text x="540" y="251" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">SIAP PAKAI (NO RUMIT)</text>

  <!-- Bottom CTA Banner -->
  <rect x="40" y="375" width="720" height="42" fill="#121212" rx="6"/>
  <text x="400" y="402" fill="#FFEE00" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="2">DOWNLOAD INSTAN SETELAH QRIS LUNAS</text>
</svg>
